# ── 한 줄 요약 (Summary) ──────────────────────────────────────────
summary: '<b>전국 17개 병원이 쓰는 의료 EMR의 백엔드와 시스템 통합을 4년 반 맡아 왔다.</b> 공공기관 연동, 망분리, 장애 대응처럼 안정성이 중요한 일을 주로 다뤘고, 최근에는 원격 테스트 플랫폼의 실시간(WebRTC)·데스크톱 기능과 React·Node 웹게임 <b>Kosmogram</b>(기획부터 배포·운영까지 혼자 출시)을 만들었다. 컴퓨터그래픽스·VR 석사(IEEE 논문) 배경으로 게임 수학도 다룬다. 추측보다 측정으로 확인하고, 문제는 원인까지 파고들어 해결한다.'


