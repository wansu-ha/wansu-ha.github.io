      - { text: 'Live (2026.06 기준)', live: true }
    stack_line: 'React 18 · SVG/Canvas · Zustand · TanStack Query · Fastify · Prisma · SQLite · Zod · Clerk · Fly.io · Cloudflare · GitHub Actions'

  # ······ T-Curity — 티켓팅 봇 방지 2-Phase CAPTCHA ······
  - id: 'tcurity'
    kind: diagram
    eyebrow: 'Team Project · 카카오클라우드 AIaaS 마스터 클래스'
    title: 'T-Curity — 티켓팅 봇 방지 2-Phase CAPTCHA'
    lead: '티켓팅 매크로·봇을 막는 행동 기반 2단계 CAPTCHA 서비스. 전체 구조 설계를 주도하고, 클라이언트 SDK와 데모 티켓사이트를 직접 구현했다.'
    disclaimer: '※ 팀 프로젝트(t-curity). 본인 담당 = 시스템 설계 주도 + 클라이언트 SDK·데모(프론트). 백엔드·AI 모델은 팀원.'
    legend: '★ = 직접 설계·구현'
    groups:
      - title: '2-Phase 행동 검증 — 프론트 비신뢰 → S2S'
        desc: '사용자 행동을 클라이언트가 캡처·인코딩하고, 최종 검증은 서버 간(S2S) 통신으로만 수행.'
        flow:
          - { t: '사용자 행동', s: '드로잉 · 선택' }
          - { arrow: '→', t: 'CAPTCHA SDK ★', s: 'TS · Phase A/B · 무의존성', key: true }
          - { arrow: '→', t: '행동 캡처·인코딩 ★', s: '포인터·궤적 · 타입 계약', key: true }
          - { arrow: '→', t: '백엔드 S2S 검증', s: 'FastAPI · 팀' }
          - { arrow: '→', t: 'AI 봇탐지', s: 'Isolation/Random Forest · 팀' }
        points:
          - '<b>전체 구조 설계 주도</b> — 2-Phase · "프론트 비신뢰" S2S 검증 모델'
          - '<b>클라이언트 SDK</b>(TypeScript·무의존성) 주 작성 — Phase A(캔버스 드로잉) + Phase B(이미지 선택), 포인터·궤적 행동 캡처→인코딩, 타입 계약·정책(비활성 타임아웃·한도)·Mock 클라이언트'
          - '<b>데모 티켓사이트</b>(React 19·Vite·Tailwind) — 예매·대기열·SDK 통합·GitHub Pages CI/CD'
        links:
          - { text: 'SDK 코드 ↗', href: 'https://github.com/t-curity/captcha-sdk', external: true }

