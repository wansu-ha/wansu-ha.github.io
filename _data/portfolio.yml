  # ······ Kosmogram ······
  - id: 'kosmogram'
    kind: showcase
    eyebrow: 'Personal Project'
    title: 'Kosmogram'
    role_line: '1인 풀스택 — 기획·설계·FE·BE·인프라·운영 · 라이브 서비스 중'
    badge: '● Live'
    links:
      - { text: '서비스 바로가기 ↗', href: 'https://kosmogram.io', primary: true, external: true }
    lead: '노노그램을 풀어 자기 영지를 가꾸는 협력 모자이크 웹게임. 노노그램 풀이 엔진, 토러스 무한 월드, 이중 통화 경제 등 알고리즘·게임 수학·동시성까지 다뤘다. 기획·아키텍처·기술 선택은 직접 결정하고, 세부 구현은 AI 페어로 가속했다.'

    # 스크린샷 — size: wide(가로 전체) / big(크게) / tall(세로) / third(1/3)
    gallery:
      - src: './assets/00-logo.png'
        alt: 'Kosmogram 로고 — A gram of grams'
        size: wide
      - src: './assets/02-world.png'
        alt: '토러스 세계'
        caption: '토러스 무한 세계 — 영지 모자이크 + 미니맵'
        size: big
      - src: './assets/01-landing.png'
        alt: '첫 화면'
        caption: '게스트로 즉시 시작'
        size: tall
      - src: './assets/03-solve.png'
        alt: '풀이'
        caption: '컬러 노노그램 풀이'
        size: third
      - src: './assets/05-create.png'
        alt: '제작'
        caption: '출제 — 실시간 유일해 검증'
        size: third
      - src: './assets/06-codex.png'
        alt: '도감'
        caption: '도감 — 발견·풀이 기록'
        size: third

    challenges_label: '핵심 도전'
    # code 는 화면에 그대로 나오는 코드 조각입니다.
    #   부등호는 &lt; &gt; 로 쓰고, 주석은 <span class="c">…</span> 로 감싸면 흐리게 표시됩니다.
    challenges:
      - title: '노노그램 풀이·출제 검증'
        desc: '5~10 가변 화판의 풀이 수를 판정(2~5개는 연작 흡수). 라인 시뮬레이션으로 난이도 별점(1~5)·라벨(universal·color_only·mono_only·maniac·reject 5종)을 매기고, 거부 시 1셀 자동수정을 제안. 완전 동일 그림은 canonical SHA-256으로 차단(회전·반사는 별개).'
        code: |-
          solveAll(hints, size, 6)
          <span class="c">// 1=단일·2~5=연작·6+=거부 (size 5~10)
          // 출제검증(PVS) p99: 5×5&lt;5ms·10×10&lt;100ms · CI 회귀 게이트</span>
      - title: '토러스 무한 월드 — 엔진 없이 직접 렌더'
        desc: '좌표가 wrap되는 도넛 평면. 거리는 짧은 경로, 겹침은 wrap 경계까지 검사. 세계=SVG/DOM 직접 렌더, UI=React.'
        code: |-
          torusDelta(95,5,100)===10
          <span class="c">// 직선 -90 대신 wrap +10</span>
      - title: '협력 경제 — 장부·동시성'
        desc: '모든 통화 변동을 장부 1행으로 원자적 기록. 더블스펜드는 조건부 감산으로 차단.'
        code: |-
          UPDATE ... SET bal = bal - :n
          WHERE bal &gt;= :n <span class="c">-- 0행이면 롤백</span>
      - title: '군집 인식 연결망'
        desc: '영지들이 자연스러운 도시처럼 뭉치도록, 토러스-MST 백본에서 가까운 간선만 군집으로 묶고 군집 사이는 다리 하나로 잇는다. 같은 군집 안은 Gabriel 기반 근접 그래프(차수 상한)로 촘촘히.'
        code: |-
          MST(rest 가중) → 군집 = rest ≤ dLocal 연결요소
          <span class="c">// intra: Gabriel(같은 군집) ∪ bridge: 군집쌍당 1
          // 라이브 렌더에서 실제 호출 (gameWorld.ts)</span>

    metrics:        # live: true 면 초록 배지
      - { text: '테스트 133' }
      - { text: 'Prisma 27 모델' }
      - { text: 'API 라우트 15' }
      - { text: '5패키지 모노레포' }
      - { text: '커밋 842' }
